<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>WhatsApp Bulk Sender</title>
</head>
<body>
    <div class="bulk-sender-container">
        <h2>WhatsApp Bulk Sender</h2>
        <input type="file" accept=".xlsx, .xls" id="file-upload" />
        <textarea id="message" placeholder="Type your message here..."></textarea>
        <input type="text" id="manual-contact" placeholder="Add contacts manually (comma separated)" />
        <button id="add-contacts">Add Contacts</button>
        <button id="send-messages">Send Messages</button>
        <p id="error-message" class="error-message"></p>
        <h3>Contacts:</h3>
        <ul id="contacts-list"></ul>
    </div>
    <script src="popup.js"></script>
</body>
</html>
